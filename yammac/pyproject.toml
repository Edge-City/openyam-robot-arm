[project]
name = "yammac"
version = "0.1.0"
description = "macOS-safe keyboard teleop for the DimOS OpenYAM blueprint"
requires-python = ">=3.10"
dependencies = ["dimos", "pygame>=2.6.1"]

[project.entry-points."dimos.blueprints"]
keyboard-teleop-openyam = "yammac.blueprints:keyboard_teleop_openyam_mac"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yammac"]
